name: Build & Push Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Backend (Django + Gunicorn) ──────────────────────────────────────
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/familymeal-backend:latest
            ghcr.io/${{ env.OWNER }}/familymeal-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to:   type=gha,scope=backend,mode=max

      # ── Frontend (Nuxt 3 SSR) ────────────────────────────────────────────
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          dockerfile: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/familymeal-frontend:latest
            ghcr.io/${{ env.OWNER }}/familymeal-frontend:${{ github.sha }}
          build-args: |
            NUXT_PUBLIC_API_BASE=/api
          cache-from: type=gha,scope=frontend
          cache-to:   type=gha,scope=frontend,mode=max

      # ── Nginx (reverse proxy) ────────────────────────────────────────────
      - name: Build & push nginx
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          dockerfile: ./nginx/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/familymeal-nginx:latest
            ghcr.io/${{ env.OWNER }}/familymeal-nginx:${{ github.sha }}
          cache-from: type=gha,scope=nginx
          cache-to:   type=gha,scope=nginx,mode=max
