# docker-compose.prod.yml — utilise les images pré-compilées depuis ghcr.io
# Usage sur Unraid : copier ce fichier + créer un .env, puis "docker compose -f docker-compose.prod.yml up -d"
#
# Variables à définir dans .env :
#   POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
#   SECRET_KEY          (clé Django, garder secrète)
#   ALLOWED_HOSTS       (ex: monserveur.local,192.168.1.10)
#   DEBUG               (laisser False en prod)

version: '3.9'

services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-familymeal}
      POSTGRES_USER:     ${POSTGRES_USER:-familymeal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-familymeal_pass}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-familymeal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/za512/familymeal-backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
    environment:
      DATABASE_URL:  postgresql://${POSTGRES_USER:-familymeal}:${POSTGRES_PASSWORD:-familymeal_pass}@db:5432/${POSTGRES_DB:-familymeal}
      REDIS_URL:     redis://redis:6379/0
      SECRET_KEY:    ${SECRET_KEY:-changeme-set-a-real-secret-in-dot-env}
      DEBUG:         ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    env_file:
      - .env

  celery:
    image: ghcr.io/za512/familymeal-backend:latest
    restart: unless-stopped
    command: celery -A familymeal worker -l info -B --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_files:/app/media
    environment:
      DATABASE_URL:  postgresql://${POSTGRES_USER:-familymeal}:${POSTGRES_PASSWORD:-familymeal_pass}@db:5432/${POSTGRES_DB:-familymeal}
      REDIS_URL:     redis://redis:6379/0
      SECRET_KEY:    ${SECRET_KEY:-changeme-set-a-real-secret-in-dot-env}
      DEBUG:         ${DEBUG:-False}
    env_file:
      - .env

  frontend:
    image: ghcr.io/za512/familymeal-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: ghcr.io/za512/familymeal-nginx:latest
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend
      - frontend
    volumes:
      - static_files:/static:ro
      - media_files:/media:ro

volumes:
  postgres_data:
  redis_data:
  media_files:
  static_files:
