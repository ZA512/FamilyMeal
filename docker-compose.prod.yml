# docker-compose.prod.yml — utilise les images pré-compilées depuis ghcr.io
# Usage sur Unraid : copier ce fichier + créer un .env, puis "docker compose -f docker-compose.prod.yml up -d"
#
# Variables à définir dans .env (même dossier que ce fichier) :
#   POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
#   SECRET_KEY          (clé Django, garder secrète)
#   ALLOWED_HOSTS       (ex: 192.168.1.10,monserveur.local) — laisser vide = accepte tout
#   DEBUG               (laisser False en prod)
#   HTTP_PORT                    (port nginx, défaut: 80)
#   DJANGO_SUPERUSER_USERNAME    (défaut: admin)
#   DJANGO_SUPERUSER_PASSWORD    (défaut: Admin1234!)
#   DJANGO_SUPERUSER_EMAIL       (défaut: admin@familymeal.local)

services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-familymeal}
      POSTGRES_USER:     ${POSTGRES_USER:-familymeal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-familymeal_pass}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-familymeal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    sysctls:
      net.core.somaxconn: 511
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/za512/familymeal-backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
    environment:
      DATABASE_URL:  postgresql://${POSTGRES_USER:-familymeal}:${POSTGRES_PASSWORD:-familymeal_pass}@db:5432/${POSTGRES_DB:-familymeal}
      REDIS_URL:     redis://redis:6379/0
      SECRET_KEY:    ${SECRET_KEY:-changeme-set-a-real-secret-in-dot-env}
      DEBUG:         ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-Admin1234!}
      DJANGO_SUPERUSER_EMAIL:    ${DJANGO_SUPERUSER_EMAIL:-admin@familymeal.local}

  celery:
    image: ghcr.io/za512/familymeal-backend:latest
    restart: unless-stopped
    command: celery -A familymeal worker -l info -B --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_files:/app/media
    environment:
      DATABASE_URL:  postgresql://${POSTGRES_USER:-familymeal}:${POSTGRES_PASSWORD:-familymeal_pass}@db:5432/${POSTGRES_DB:-familymeal}
      REDIS_URL:     redis://redis:6379/0
      SECRET_KEY:    ${SECRET_KEY:-changeme-set-a-real-secret-in-dot-env}
      DEBUG:         ${DEBUG:-False}

  frontend:
    image: ghcr.io/za512/familymeal-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: ghcr.io/za512/familymeal-nginx:latest
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend
      - frontend
    volumes:
      - static_files:/static:ro
      - media_files:/media:ro

volumes:
  postgres_data:
  redis_data:
  media_files:
  static_files:
